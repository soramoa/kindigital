<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kindle Board</title>
<style>
  html, body { margin: 0; padding: 0; background: #fff; color: #000; overflow-x: hidden; }
  body { font-family: "Hiragino Kaku Gothic ProN", "Noto Sans CJK JP", sans-serif; font-size: 25px; padding: 0.7em; }
  #date { font-size: 1.6em; font-weight: bold; }
  #time { font-size: 7.2em; font-weight: bold; line-height: 1.05; letter-spacing: -0.03em; margin: 0.1em 0 0.3em; white-space: nowrap; }
  .box { border-top: 0.25em solid #000; padding-top: 0.6em; margin-top: 0.8em; }
  .label { font-size: 1em; color: #444; }
  #now { font-size: 2.2em; font-weight: bold; margin: 0.15em 0; }
  #detail { font-size: 1.2em; }
  .day { display: block; font-size: 1.3em; padding: 0.35em 0; border-bottom: 2px solid #888; }
  .day b { display: inline-block; width: 4.2em; }
  #status { font-size: 0.8em; color: #666; margin-top: 1em; }
</style>
</head>
<body>
<div id="date">&nbsp;</div>
<div id="time">--:--</div>

<div class="box">
  <div class="label">現在の天気（<span id="place">沖縄</span>）</div>
  <div id="now">読み込み中…</div>
  <div id="detail">&nbsp;</div>
</div>

<div class="box">
  <div class="label">これからの天気</div>
  <div id="days"></div>
</div>

<div id="status"></div>

<script>
// ===== 設定 =====
var LAT = 26.20;   // 緯度（与那原付近）
var LON = 127.72;  // 経度
var WEATHER_INTERVAL_MIN = 20; // 天気の更新間隔（分）
var FIT_DIVISOR = 19;          // 文字サイズの基準（小さくすると全体が大きくなる）
// ================

var WEEK = ["日","月","火","水","木","金","土"];

function pad(n) { return n < 10 ? "0" + n : "" + n; }

// 端末のタイムゾーン設定に関係なく、常に日本時間(JST)で扱う
function jst() { return new Date(Date.now() + 9 * 3600 * 1000); }

// 画面の幅に合わせて文字サイズを決める
function fit() {
  var w = document.documentElement.clientWidth || window.innerWidth || 600;
  document.body.style.fontSize = (w / FIT_DIVISOR) + "px";
}

function wcode(c) {
  if (c === 0) return "快晴";
  if (c === 1) return "晴れ";
  if (c === 2) return "晴れ時々くもり";
  if (c === 3) return "くもり";
  if (c === 45 || c === 48) return "霧";
  if (c >= 51 && c <= 57) return "霧雨";
  if (c >= 61 && c <= 67) return "雨";
  if (c >= 71 && c <= 77) return "雪";
  if (c >= 80 && c <= 82) return "にわか雨";
  if (c === 85 || c === 86) return "にわか雪";
  if (c >= 95) return "雷雨";
  return "--";
}

var lastMinute = -1;
function tick() {
  var d = jst();
  if (d.getUTCMinutes() === lastMinute) return;
  lastMinute = d.getUTCMinutes();
  document.getElementById("time").innerHTML = pad(d.getUTCHours()) + ":" + pad(d.getUTCMinutes());
  document.getElementById("date").innerHTML =
    d.getUTCFullYear() + "年" + (d.getUTCMonth() + 1) + "月" + d.getUTCDate() + "日（" + WEEK[d.getUTCDay()] + "）";
}

function loadWeather() {
  var url = "https://api.open-meteo.com/v1/forecast?latitude=" + LAT + "&longitude=" + LON +
    "&current=temperature_2m,apparent_temperature,relative_humidity_2m,wind_speed_10m,weather_code" +
    "&daily=weather_code,temperature_2m_max,temperature_2m_min" +
    "&timezone=Asia%2FTokyo&forecast_days=4&wind_speed_unit=ms";
  var xhr = new XMLHttpRequest();
  xhr.open("GET", url, true);
  xhr.onreadystatechange = function () {
    if (xhr.readyState !== 4) return;
    var st = document.getElementById("status");
    if (xhr.status !== 200) {
      st.innerHTML = "天気の取得に失敗しました（次回再試行）";
      return;
    }
    try {
      var j = JSON.parse(xhr.responseText);
      var c = j.current;
      document.getElementById("now").innerHTML =
        wcode(c.weather_code) + " " + Math.round(c.temperature_2m) + "℃";
      document.getElementById("detail").innerHTML =
        "体感" + Math.round(c.apparent_temperature) + "℃ 湿度" + Math.round(c.relative_humidity_2m) +
        "% 風" + Math.round(c.wind_speed_10m) + "m/s";
      var html = "";
      var dl = j.daily;
      for (var i = 0; i < dl.time.length; i++) {
        var p = dl.time[i].split("-");
        var wd = new Date(Date.UTC(+p[0], +p[1] - 1, +p[2])).getUTCDay();
        var name = i === 0 ? "今日" : (i === 1 ? "明日" : (+p[1]) + "/" + (+p[2]) + "(" + WEEK[wd] + ")");
        html += '<span class="day"><b>' + name + "</b>" + wcode(dl.weather_code[i]) + " " +
          Math.round(dl.temperature_2m_max[i]) + "/" + Math.round(dl.temperature_2m_min[i]) + "℃</span>";
      }
      document.getElementById("days").innerHTML = html;
      var n = jst();
      st.innerHTML = "天気 " + pad(n.getUTCHours()) + ":" + pad(n.getUTCMinutes()) + " 更新";
    } catch (e) {
      st.innerHTML = "天気データの読み取りに失敗しました";
    }
  };
  xhr.send();
}

fit();
tick();
loadWeather();
window.onresize = fit;
setInterval(tick, 10000);
setInterval(loadWeather, WEATHER_INTERVAL_MIN * 60 * 1000);
</script>
</body>
</html>
